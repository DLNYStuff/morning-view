<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DLNY Morning View">
<meta name="theme-color" content="#f2f0ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
<title>DLNY Morning View</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f2f0ec;
    --surface: #ffffff;
    --border: rgba(0,0,0,0.10);
    --border-strong: rgba(0,0,0,0.20);
    --text: #141412;
    --text2: #3a3a36;
    --text3: #6e6e68;
    --radius: 16px;
    --font: 'Plus Jakarta Sans', system-ui, sans-serif;
    --mono: 'Plus Jakarta Sans', system-ui, sans-serif;
    --hdr-blue-bg: #B5D4F4;   --hdr-blue-fg: #0C447C;
    --hdr-teal-bg: #9FE1CB;   --hdr-teal-fg: #085041;
    --hdr-amber-bg: #FFF176;  --hdr-amber-fg: #7A6000;
    --hdr-purple-bg: #CECBF6; --hdr-purple-fg: #3C3489;
    --hdr-green-bg: #C0DD97;  --hdr-green-fg: #27500A;
    --asp-sus: #27500A;
    --asp-eff: #791F1F;
    --no-park: #C0392B;
    --today-border: #0C447C;
    --today-bg: #EBF3FC;
    --today-text: #0C447C;
    --holiday-fg: #3B6D11;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111110;
      --surface: #1c1c1a;
      --border: rgba(255,255,255,0.09);
      --border-strong: rgba(255,255,255,0.18);
      --text: #f0ede6;
      --text2: #c0bdb6;
      --text3: #888880;
      --hdr-blue-bg: #0C447C;   --hdr-blue-fg: #B5D4F4;
      --hdr-teal-bg: #085041;   --hdr-teal-fg: #9FE1CB;
      --hdr-amber-bg: #7A6000;  --hdr-amber-fg: #FFF176;
      --hdr-purple-bg: #3C3489; --hdr-purple-fg: #CECBF6;
      --hdr-green-bg: #27500A;  --hdr-green-fg: #C0DD97;
      --asp-sus: #C0DD97;
      --asp-eff: #F7C1C1;
      --no-park: #F08080;
      --today-border: #B5D4F4;
      --today-bg: #0C1E30;
      --today-text: #B5D4F4;
      --holiday-fg: #97C459;
    }
  }

  html, body {
    min-height: 100vh; min-height: 100dvh;
    background: var(--bg);
    font-family: var(--font);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  body {
    padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
    max-width: 740px;
    margin: 0 auto;
  }

  /* ── Header ── */
  header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px; padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 12px; font-weight: 600; color: var(--text3); letter-spacing: 0.10em; text-transform: uppercase; }
  #header-date { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--text3); }

  /* ── Top card grid ── */
  /* Grid replaced with row-based flex for consistent spacing */
  .grid-top {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-auto-rows: auto;
    gap: 9px;
    margin-bottom: 9px;
  }
  /* Half height cards — rows 1 and 2 */
  .grid-top > *:nth-child(1),
  .grid-top > *:nth-child(2),
  .grid-top > *:nth-child(3),
  .grid-top > *:nth-child(4) { min-height: 88px; }
  /* Full height cards — row 3 */
  .grid-top > *:nth-child(5),
  .grid-top > *:nth-child(6) { min-height: 118px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; height: 100%; }
  .card-header { padding: 7px 11px 6px; display: flex; align-items: center; gap: 5px; }
  .card-header svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .card-label { font-size: 9px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; white-space: nowrap; }
  .card-body { padding: 9px 11px 11px; flex: 1; }
  .card-value { font-size: 22px; font-weight: 500; color: var(--text); line-height: 1; margin-bottom: 4px; white-space: nowrap; }
  .card-sub { font-size: 12px; font-weight: 600; color: var(--text2); line-height: 1.4; }
  @media (max-width: 400px) { .card-value { font-size: 20px; } .card-sub { font-size: 11px; } }

  /* ── Card header colors ── */
  .hdr-blue   { background: var(--hdr-blue-bg);   color: var(--hdr-blue-fg); }
  .hdr-teal   { background: var(--hdr-teal-bg);   color: var(--hdr-teal-fg); }
  .hdr-amber  { background: var(--hdr-amber-bg);  color: var(--hdr-amber-fg); }
  .hdr-purple { background: var(--hdr-purple-bg); color: var(--hdr-purple-fg); }
  .hdr-green  { background: var(--hdr-green-bg);  color: var(--hdr-green-fg); }
  .hdr-week   { background: #FFF176; color: #7A6000; }
  @media (prefers-color-scheme: dark) { .hdr-week { background: #7A6000; color: #FFF176; } }

  /* ── Weather ── */
  .weather-row { display: flex; align-items: center; gap: 8px; }
  .w-emoji { font-size: 24px; line-height: 1; }
  .w-temp  { font-size: 24px; font-weight: 500; font-family: var(--mono); color: var(--text); line-height: 1; }
  .w-desc  { font-size: 12px; font-weight: 600; color: var(--text2); margin-top: 3px; }
  .w-meta  { font-size: 11px; font-weight: 600; color: var(--text3); margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }

  /* ── Battery ── */
  .batt-wrap { display: flex; align-items: center; gap: 8px; margin-top: 9px; }
  .batt-shell {
    width: 44px; height: 20px;
    border: 1.5px solid var(--border-strong);
    border-radius: 4px; position: relative;
    padding: 2px; display: flex; align-items: center;
  }
  .batt-shell::after {
    content: ''; position: absolute; right: -5px; top: 50%; transform: translateY(-50%);
    width: 3px; height: 8px; background: var(--border-strong); border-radius: 0 2px 2px 0;
  }
  .batt-fill { height: 100%; border-radius: 2px; transition: width .5s, background .5s; }
  #battery-status { font-size: 12px; font-weight: 600; }

  /* ── ASP Today card body ── */
  .no-park-symbol { display: flex; align-items: center; gap: 10px; }
  .no-park-symbol svg { width: 40px; height: 40px; flex-shrink: 0; }
  .no-park-label { font-size: 15px; font-weight: 600; color: var(--no-park); line-height: 1.3; }

  /* ── ASP Week card ── */
  .asp-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-top: 0; margin-bottom: 0; }
  .asp-card-header { padding: 7px 11px 6px; display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
  .asp-card-header-left { display: flex; align-items: center; gap: 5px; font-size: 9px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; }
  .asp-card-header-left svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .asp-card-body { padding: 8px 8px 10px; }

  /* ── Week navigation ── */
  .week-nav { display: flex; align-items: center; gap: 5px; }
  .nav-btn { background: rgba(0,0,0,0.12); border: none; border-radius: 5px; width: 22px; height: 22px; cursor: pointer; font-size: 14px; font-weight: 600; color: inherit; display: flex; align-items: center; justify-content: center; }
  .nav-btn:hover { background: rgba(0,0,0,0.22); }
  .week-label { font-size: 10px; font-weight: 600; min-width: 52px; text-align: center; }

  /* ── Week grid ── */
  .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .day-cell { border-radius: 6px; padding: 5px 2px 5px; text-align: center; border: 1px solid var(--border); min-width: 0; }
  .day-cell.today { border: 2.5px solid var(--today-border); background: var(--today-bg); }
  .day-name { font-size: 9px; font-weight: 600; color: var(--text3); margin-bottom: 2px; white-space: nowrap; }
  .day-cell.today .day-name { font-weight: 700; color: var(--today-text); }
  .day-num { font-size: 12px; font-weight: 500; color: var(--text); font-family: var(--mono); margin-bottom: 3px; line-height: 1; }
  .day-cell.today .day-num { font-weight: 700; color: var(--today-text); font-size: 13px; }
  .cell-icon { margin: 1px auto 0; display: flex; align-items: center; justify-content: center; }
  .cell-icon svg { width: 14px; height: 14px; }
  .holiday-label { font-size: 8px; font-weight: 600; color: var(--holiday-fg); margin-top: 2px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }

  /* ── ASP status bar ── */
  .asp-live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; vertical-align: middle; flex-shrink: 0; }
  .asp-live-dot.loading  { background: #BA7517; animation: pulse 1s infinite; }
  .asp-live-dot.live     { background: #3B6D11; }
  .asp-live-dot.cached   { background: #BA7517; }
  .asp-live-dot.fallback { background: #BA7517; }
  .asp-live-dot.error    { background: #E24B4A; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{ opacity:1; } 50%{ opacity:0.4; } }

  .asp-status-bar { display: flex; align-items: center; gap: 5px; margin-top: 7px; padding: 5px 8px; border-radius: 6px; font-size: 10px; font-weight: 600; line-height: 1.4; }
  .asp-status-bar.live     { background: #EAF3DE; color: #27500A; }
  .asp-status-bar.cached   { background: #FAEEDA; color: #633806; }
  .asp-status-bar.fallback { background: #FAEEDA; color: #633806; }
  .asp-status-bar.error    { background: #FCEBEB; color: #791F1F; }
  @media (prefers-color-scheme: dark) {
    .asp-status-bar.live     { background: #173404; color: #C0DD97; }
    .asp-status-bar.cached   { background: #2a1e04; color: #FAC775; }
    .asp-status-bar.fallback { background: #2a1e04; color: #FAC775; }
    .asp-status-bar.error    { background: #2a1010; color: #F7C1C1; }
  }

  /* ── Grayed out when data unavailable ── */
  .asp-disabled { opacity: 0.35; pointer-events: none; filter: grayscale(1); user-select: none; }

  /* ── Footer ── */
  footer { margin-top: 10px; text-align: center; font-size: 10px; font-weight: 500; color: var(--text3); border-top: 1px solid var(--border); padding-top: 10px; }

  /* Phone / Messages blocks */
  .hdr-phone   { background: #C0DD97; color: #27500A; }
  .hdr-msg     { background: #93C5FD; color: #1E3A5F; }
  @media (prefers-color-scheme: dark) {
    .hdr-phone { background: #27500A; color: #C0DD97; }
    .hdr-msg   { background: #1E3A5F; color: #93C5FD; }
  }

  /* Half height card body — icon left, content right */
  .half-body { padding: 8px 11px 10px; flex: 1; display: flex; align-items: center; gap: 10px; }
  .half-icon { flex-shrink: 0; }
  .half-content { display: flex; flex-direction: column; justify-content: center; }

  .dial-btn { width: 36px; height: 36px; border-radius: 50%; background: #2E7D32; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .dial-btn svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .msg-btn { width: 36px; height: 36px; border-radius: 50%; background: #1E3A5F; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .msg-btn svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .count-val-red  { font-size: 18px; font-weight: 700; color: #791F1F; line-height: 1; }
  .count-val-blue { font-size: 18px; font-weight: 700; color: #0C447C; line-height: 1; }
  .count-label { font-size: 10px; font-weight: 500; color: var(--text2); margin-top: 1px; }
  @media (prefers-color-scheme: dark) {
    .count-val-red  { color: #F7C1C1; }
    .count-val-blue { color: #B5D4F4; }
  }

  .card-phone { cursor: pointer; }
  .card-phone:active { opacity: 0.85; }

  /* Maps block */
  .hdr-maps { background: #BBDEFB; color: #0D47A1; }
  @media (prefers-color-scheme: dark) { .hdr-maps { background: #0D47A1; color: #BBDEFB; } }
  .maps-btn { width: 36px; height: 36px; border-radius: 50%; background: #1565C0; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
</style>
</head>
<body>

<header>
  <h1>DLNY Morning View</h1>
  <span id="header-date"></span>
</header>

<div class="grid-top">

  <!-- ROW 1: Calls | Messages -->
  <a href="tel:" class="card card-phone" style="text-decoration:none;">
    <div class="card-header hdr-phone">
      <svg viewBox="0 0 24 24" style="width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.41 2 2 0 0 1 3.6 1.22h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.82a16 16 0 0 0 6.29 6.29l.98-.97a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      <span class="card-label">Calls</span>
    </div>
    <div class="half-body">
      <div class="half-icon">
        <div class="dial-btn">
          <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.41 2 2 0 0 1 3.6 1.22h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.82a16 16 0 0 0 6.29 6.29l.98-.97a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </div>
      </div>
      <div class="half-content">
        <div class="count-val-red" id="missed-calls">—</div>
        <div class="count-label">Missed calls</div>
      </div>
    </div>
  </a>

  <a href="sms:" onclick="openMessages(event)" class="card card-phone" style="text-decoration:none;">
    <div class="card-header hdr-msg">
      <svg viewBox="0 0 24 24" style="width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span class="card-label">Messages</span>
    </div>
    <div class="half-body">
      <div class="half-icon">
        <div class="msg-btn">
          <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </div>
      </div>
      <div class="half-content">
        <div class="count-val-blue" id="unread-msgs">—</div>
        <div class="count-label">Unread messages</div>
      </div>
    </div>
  </a>

  <!-- ROW 2: ASP Today | TBD -->
  <div class="card">
    <div class="card-header hdr-amber">
      <svg viewBox="0 0 24 24" style="width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;"><path d="M5 17H3a1 1 0 0 1-1-1v-4l2.5-5h11l2.5 5v4a1 1 0 0 1-1 1h-2"/><rect x="6" y="15" width="3" height="3" rx="1.5"/><rect x="15" y="15" width="3" height="3" rx="1.5"/><path d="M4.5 12h15"/></svg>
      <span class="card-label">ASP Today</span>
    </div>
    <div class="half-body" id="asp-today-body">
      <div style="font-size:11px;font-weight:500;color:var(--text3);">Loading...</div>
    </div>
  </div>

  <div class="card">
    <div class="card-header hdr-tbd">
      <svg viewBox="0 0 24 24" style="width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span class="card-label">TBD</span>
    </div>
    <div class="half-body">
      <div class="half-icon">
        <div class="tbd-circle">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </div>
      </div>
      <div class="half-content">
        <div style="font-size:11px;font-weight:500;color:var(--text3);">Coming soon</div>
      </div>
    </div>
  </div>

  <!-- ROW 3: Time/Battery | Weather -->
  <div class="card">
    <div class="card-header hdr-blue" style="gap:2px;">
      <svg viewBox="0 0 24 24" style="width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <svg viewBox="0 0 24 24" style="width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;margin-left:1px;"><rect x="2" y="7" width="18" height="11" rx="2"/><path d="M22 11v3"/></svg>
      <span class="card-label" style="margin-left:2px;">Time / Batt</span>
    </div>
    <div class="card-body" style="display:flex;flex-direction:column;align-items:center;justify-content:center;">
      <div class="card-value" id="time-display" style="font-size:22px;">--:--</div>
      <div class="card-sub" id="date-display" style="font-weight:700;">Loading...</div>
      <hr style="border:none;border-top:0.5px solid var(--border);margin:7px 0;width:100%;">
      <div style="display:flex;align-items:center;gap:7px;">
        <div id="battery-pct" style="font-size:18px;font-weight:500;color:#3B6D11;line-height:1;">—</div>
        <div class="batt-shell"><div class="batt-fill" id="battery-fill"></div></div>
        <span id="battery-status" style="font-size:18px;line-height:1;"></span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header hdr-teal">
      <svg viewBox="0 0 24 24" style="width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>
      <span class="card-label">Weather · NYC</span>
    </div>
    <div class="card-body" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;">
      <div id="weather-content" style="font-size:13px;font-weight:600;color:var(--text2);text-align:center;">Fetching...</div>
    </div>
  </div>

</div>

<!-- Week view -->
<div class="asp-card">
  <div class="asp-card-header hdr-week">
    <div class="asp-card-header-left">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Alt Side Parking
    </div>
    <div class="week-nav">
      <button class="nav-btn" id="prev-week">&#8249;</button>
      <span class="week-label" id="week-label">This week</span>
      <button class="nav-btn" id="next-week">&#8250;</button>
    </div>
  </div>
  <div class="asp-card-body" id="asp-card-body">
    <div class="week-grid" id="week-grid"></div>
    <div class="asp-status-bar fallback" id="asp-status-bar">
      <span class="asp-live-dot loading" id="asp-dot"></span> Loading ASP data...
    </div>
  </div>
</div>

<footer>New York City &nbsp;·&nbsp; Weather via Open-Meteo &nbsp;·&nbsp; ASP via NYC 311 Official API</footer>

<script>
// ─────────────────────────────────────────
// API KEY — add yours here
// ─────────────────────────────────────────
const NYC311_API_KEY = '';  // ← paste your NYC 311 Public Developers primary key between the quotes

// ─────────────────────────────────────────
// SVG ICONS
// ─────────────────────────────────────────
const ICON_NO_PARK_LG = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width:40px;height:40px;flex-shrink:0;">
  <circle cx="12" cy="12" r="10" fill="none" stroke="#C0392B" stroke-width="2"/>
  <line x1="5" y1="5" x2="19" y2="19" stroke="#C0392B" stroke-width="2.2" stroke-linecap="round"/>
</svg>`;

let aspSuspensions = {};

// ─────────────────────────────────────────
// CACHE HELPERS
// ─────────────────────────────────────────
const CACHE_KEY      = 'dlny_asp_cache';
const CACHE_DATE_KEY = 'dlny_asp_cache_date';

function saveCache(data) {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify(data));
    localStorage.setItem(CACHE_DATE_KEY, new Date().toISOString());
  } catch(e) {}
}

function loadCache() {
  try {
    const raw  = localStorage.getItem(CACHE_KEY);
    const date = localStorage.getItem(CACHE_DATE_KEY);
    if (!raw || !date) return null;
    return { data: JSON.parse(raw), date: new Date(date) };
  } catch(e) { return null; }
}

function cacheStale(cacheDate) {
  if (!cacheDate) return true;
  return (new Date() - cacheDate) / 86400000 > 30; // >30 days old
}

function fallbackExpired() {
  const exp = new Date(FALLBACK_EXPIRY);
  exp.setHours(23, 59, 59);
  return new Date() > exp;
}

// ─────────────────────────────────────────
// ASP STATUS BAR
// ─────────────────────────────────────────
function setASPStatus(state, cacheDate) {
  const dot     = document.getElementById('asp-dot');
  const bar     = document.getElementById('asp-status-bar');
  const todayEl = document.getElementById('asp-today-body');
  const weekEl  = document.getElementById('asp-card-body');

  // Reset classes
  bar.className = 'asp-status-bar';
  dot.className = 'asp-live-dot';
  todayEl.classList.remove('asp-disabled');
  weekEl.classList.remove('asp-disabled');

  const msgs = {
    live:     ['live',     'Live data · NYC 311 Official API'],
    cached:   ['cached',   `Saved data from ${cacheDate ? cacheDate.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : 'recently'} · NYC API temporarily unavailable`],
    fallback: ['fallback', 'Using 2026 saved calendar · NYC API temporarily unavailable'],
    expired:  ['error',    'Calendar out of date · No API available · ASP info unavailable'],
  };

  const [cls, msg] = msgs[state] || msgs.expired;
  dot.classList.add(cls);
  bar.classList.add(cls);
  bar.innerHTML = `<span class="asp-live-dot ${cls}"></span> ${msg}`;

  if (state === 'expired') {
    todayEl.classList.add('asp-disabled');
    weekEl.classList.add('asp-disabled');
  }
}

// ─────────────────────────────────────────
// FETCH ASP DATA — 4-tier waterfall
// 1. NYC 311 Official API (authenticated)
// 2. localStorage cache (≤30 days old)
// 3. Static 2026 fallback calendar
// 4. Expired state — gray out blocks
// ─────────────────────────────────────────
async function fetchASPData() {
  try {
    const controller = new AbortController();
    const tid = setTimeout(() => controller.abort(), 8000);

    // API requires fromDate and toDate in YYYYMMDD format
    // Fetch from yesterday through 90 days ahead to cover full suspension calendar
    const fromDate = new Date();
    fromDate.setDate(fromDate.getDate() - 1);
    const toDate = new Date();
    toDate.setDate(toDate.getDate() + 90);

    function toAPIDate(d) {
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    // Route through Cloudflare Worker proxy to bypass CORS
    const res = await fetch(`https://nyc-asp-proxy.dlopenzina.workers.dev/?fromdate=${toAPIDate(fromDate)}&todate=${toAPIDate(toDate)}`, {
      signal: controller.signal
    });
    clearTimeout(tid);

    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    // Parse — response format: { days: [{ today_id: "YYYYMMDD", items: [...] }] }
    const days = data.days || [];
    if (!days.length) throw new Error('Empty response');

    const live = {};
    days.forEach(day => {
      // today_id is "YYYYMMDD" — convert to "YYYY-MM-DD"
      const raw = day.today_id || '';
      if (raw.length !== 8) return;
      const key = `${raw.substring(0,4)}-${raw.substring(4,6)}-${raw.substring(6,8)}`;

      (day.items || []).forEach(item => {
        if (item.type === 'Alternate Side Parking' && item.status === 'SUSPENDED') {
          live[key] = item.exceptionName || item.details || 'Suspended';
        }
      });
    });

    console.log('NYC 311 API: parsed', Object.keys(live).length, 'suspended dates from', days.length, 'days');

    // Only save to cache if we got a real response with days
    // An empty suspensions object is valid — means no suspensions in this date range
    if (days.length > 0) saveCache(live);
    aspSuspensions = live;
    setASPStatus('live');

  } catch(e) {
    console.warn('NYC 311 API:', e.message);

    // Try cache
    const cached = loadCache();
    if (cached && !cacheStale(cached.date)) {
      aspSuspensions = cached.data;
      setASPStatus('cached', cached.date);

    } else if (!fallbackExpired()) {
      // Use static calendar
      aspSuspensions = { ...ASP_FALLBACK };
      setASPStatus('fallback');

    } else {
      // Everything exhausted
      aspSuspensions = {};
      setASPStatus('expired');
    }
  }

  updateTodayAsp();
  renderWeek();
}

// ─────────────────────────────────────────
// DATE HELPERS
// ─────────────────────────────────────────
function toKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// Sunday = universally no ASP; otherwise API-driven
function getAsp(date) {
  if (date.getDay() === 0)         return { s: 'sunday',    r: 'No ASP Sundays' };
  if (aspSuspensions[toKey(date)]) return { s: 'suspended', r: aspSuspensions[toKey(date)] };
  return                                  { s: 'effect',    r: 'Move your car' };
}

function updateClock() {
  const n   = new Date();
  const dow = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][n.getDay()];
  document.getElementById('time-display').textContent =
    n.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});

  dateEl.textContent = `${dow}, ${n.toLocaleDateString('en-US', {month:'short', day:'numeric'})}`;

}

// ─────────────────────────────────────────
// BATTERY
// ─────────────────────────────────────────
async function initBattery() {
  const p = document.getElementById('battery-pct');
  const f = document.getElementById('battery-fill');
  const s = document.getElementById('battery-status');

  function render(level, charging) {
    const pct = Math.round(level * 100);
    const color = pct > 50 ? '#3B6D11' : pct > 20 ? '#BA7517' : '#E24B4A';
    p.textContent = pct + '%';
    p.style.color = color;
    f.style.width = pct + '%';
    f.style.background = color;
    s.textContent = charging ? '⚡' : '';
    s.style.color = '#BA7517';
  }

  if ('getBattery' in navigator) {
    try {
      const b = await navigator.getBattery();
      render(b.level, b.charging);
      b.addEventListener('levelchange',   () => render(b.level, b.charging));
      b.addEventListener('chargingchange', () => render(b.level, b.charging));
    } catch(e) { p.textContent = 'N/A'; }
  } else {
    p.textContent = 'N/A';
  }
}

// ─────────────────────────────────────────
// WEEK VIEW
// ─────────────────────────────────────────
let weekOffset = 0;

function getWeekDates(offset) {
  const today = new Date();
  const dow   = today.getDay();
  const mon   = new Date(today);
  mon.setDate(today.getDate() - (dow === 0 ? 6 : dow - 1) + offset * 7);
  return Array.from({length: 7}, (_, i) => {
    const d = new Date(mon);
    d.setDate(mon.getDate() + i);
    return d;
  });
}

function renderWeek() {
  const grid     = document.getElementById('week-grid');
  const lbl      = document.getElementById('week-label');
  const todayKey = toKey(new Date());
  const days     = getWeekDates(weekOffset);
  const isMobile = window.innerWidth < 480;
  const shortNames = ['M','T','W','T','F','S','S'];
  const longNames  = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  const startMonth = days[0].toLocaleDateString('en-US', {month:'short'});
  const endMonth   = days[6].toLocaleDateString('en-US', {month:'short'});
  const monthLabel = startMonth === endMonth ? startMonth : `${startMonth}/${endMonth}`;
  if (weekOffset === 0)       lbl.textContent = `This week · ${monthLabel}`;
  else if (weekOffset === 1)  lbl.textContent = `Next week · ${monthLabel}`;
  else if (weekOffset === -1) lbl.textContent = `Last week · ${monthLabel}`;
  else lbl.textContent = `${days[0].toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${days[6].toLocaleDateString('en-US',{month:'short',day:'numeric'})}`;

  grid.innerHTML = days.map((d, i) => {
    const a      = getAsp(d);
    const isToday = toKey(d) === todayKey;
    const label  = isMobile ? shortNames[i] : longNames[i];

    let icon, subLabel = '';
    if (a.s === 'suspended') {
      icon = ICON_SUSPENDED_SM;
      subLabel = `<div class="holiday-label">${a.r.split(' ')[0]}</div>`;
    } else if (a.s === 'sunday') {
      icon = ICON_SUSPENDED_SM;
      subLabel = `<div class="holiday-label" style="color:var(--text3);">No ASP</div>`;
    } else {
      icon = ICON_NO_PARK_SM;
    }

    return `<div class="day-cell${isToday ? ' today' : ''}">
      <div class="day-name">${label}</div>
      <div class="day-num">${d.getDate()}</div>
      <div class="cell-icon">${icon}</div>
      ${subLabel}
    </div>`;
  }).join('');
}

async function fetchWeather() {
  const el = document.getElementById('weather-content');
  try {
    const res  = await fetch('https://api.open-meteo.com/v1/forecast?latitude=40.7128&longitude=-74.0060&current=temperature_2m,weathercode,windspeed_10m,apparent_temperature,relativehumidity_2m&daily=temperature_2m_max,temperature_2m_min,uv_index_max&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America/New_York&forecast_days=1');

    const { temperature_2m: temp, apparent_temperature: feels, windspeed_10m: wind, weathercode: code, relativehumidity_2m: humidity } = data.current;

    const lo = data.daily.temperature_2m_min[0];

      if (uv <= 2) return { label: 'Low', color: '#3B6D11' };
      if (uv <= 5) return { label: 'Moderate', color: '#BA7517' };
      if (uv <= 7) return { label: 'High', color: '#C0392B' };
      if (uv <= 10) return { label: 'Very High', color: '#8B008B' };
      return { label: 'Extreme', color: '#8B0000' };

    const uvInfo = uvLabel(Math.round(uv));
    // Set date color to match UV index
    const dateEl2 = document.getElementById('date-display');
    if (dateEl2) dateEl2.style.color = uvInfo.color;

    const icons = {0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌦️',61:'🌧️',63:'🌧️',65:'🌧️',71:'❄️',73:'❄️',75:'❄️',80:'🌦️',81:'🌧️',82:'⛈️',95:'⛈️',96:'⛈️',99:'⛈️'};
    const descs = {0:'Clear skies',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Foggy',48:'Foggy',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',71:'Light snow',73:'Snow',75:'Heavy snow',80:'Showers',81:'Heavy showers',82:'Thunderstorm',95:'Thunderstorm',96:'Thunderstorm',99:'Thunderstorm'};

    el.innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:center;text-align:center;">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;">
          <span style="font-size:22px;line-height:1;">${icons[code] || '🌡️'}</span>
          <span style="font-size:22px;font-weight:500;color:var(--text);font-family:var(--mono);">${Math.round(temp)}°F</span>
        </div>
        <div style="font-size:11px;font-weight:500;color:var(--text2);margin-bottom:5px;">${descs[code] || 'Unknown'}</div>
        <div style="font-size:10px;font-weight:500;color:var(--text3);margin-bottom:3px;">Feels ${Math.round(feels)}° &nbsp;·&nbsp; H:${Math.round(hi)}° L:${Math.round(lo)}°</div>
        <div style="display:flex;align-items:center;justify-content:center;gap:8px;font-size:10px;font-weight:500;color:var(--text3);margin-bottom:3px;">
          <span style="display:flex;align-items:center;gap:3px;">
            <svg viewBox="0 0 24 24" style="width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;"><path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/></svg>
            ${Math.round(wind)}mph
          </span>
          <span style="display:flex;align-items:center;gap:3px;">
            <svg viewBox="0 0 24 24" style="width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
            ${Math.round(humidity)}%
          </span>
        </div>
        <div style="display:flex;align-items:center;gap:3px;font-size:10px;font-weight:600;color:${uvInfo.color};">
          <svg viewBox="0 0 24 24" style="width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          UV ${Math.round(uv)} · ${uvInfo.label}
        </div>
      </div>`;
  } catch(e) {
    el.innerHTML = '<span style="font-size:13px;font-weight:600;color:var(--text2);">Weather unavailable</span>';
  }
}

// ─────────────────────────────────────────
// MESSAGES OPENER
// ─────────────────────────────────────────
function openMessages(e) {
  e.preventDefault();
  // Try Samsung Messages directly first
  const attempts = [
    'sms:',
    'android-app://com.samsung.android.messaging',
  ];
  // Use a small delay between attempts
  let i = 0;
  function tryNext() {
    if (i < attempts.length) {
      window.location.href = attempts[i];
      i++;
      setTimeout(tryNext, 500);
    }
  }
  tryNext();
}

// ─────────────────────────────────────────
// INIT
// ─────────────────────────────────────────
document.getElementById('prev-week').addEventListener('click', () => { weekOffset--; renderWeek(); });
document.getElementById('next-week').addEventListener('click', () => { weekOffset++; renderWeek(); });
window.addEventListener('resize', renderWeek);

updateClock();
setInterval(updateClock, 1000);

renderWeek();          // render immediately with fallback data
fetchASPData();        // then try live API — re-renders on completion
fetchWeather();
initBattery();

setInterval(fetchASPData, 6 * 60 * 60 * 1000);  // refresh ASP every 6 hours
setInterval(fetchWeather, 10 * 60 * 1000);       // refresh weather every 10 minutes
</script>
